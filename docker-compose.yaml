
services:
  keycloak-db:
    image: postgres:16
    container_name: pacioli-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: pacioli-keycloak
    restart: unless-stopped
    command:
      - start
      - --hostname=http://localhost:8081
      - --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  pacioli-db:
    image: postgres:16
    container_name: pacioli-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PACIOLI_DB}
      POSTGRES_USER: ${PACIOLI_DB_USER}
      POSTGRES_PASSWORD: ${PACIOLI_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pacioli-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PACIOLI_DB_USER} -d ${PACIOLI_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak-db-data:
  pacioli-db-data:
